<svg width="780" height="780" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="arch-top-master" d="M 64,250 A 186,186 0 1,1 436,250" fill="none" />
  </defs>

  <!-- Outer Double Concentric Rim -->
  <circle cx="250" cy="250" r="242" fill="none" stroke="#0B1F4D" stroke-width="8" />
  <circle cx="250" cy="250" r="228" fill="none" stroke="#142D5E" stroke-width="2" />
  
  <!-- White Ring Band for Arched Text -->
  <circle cx="250" cy="250" r="162" fill="none" stroke="#0B1F4D" stroke-width="2.5" />

  <!-- Arched Text SIPADU (Curved with Precision Letter-Spacing) -->
  <text font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-weight="900" font-size="44" fill="#0B1F4D" letter-spacing="14">
    <textPath href="#arch-top-master" startOffset="50%" text-anchor="middle">
      SIPADU
    </textPath>
  </text>

  <!-- Bottom Symmetry Accents -->
  <g fill="#0B1F4D">
    <circle cx="205" cy="442" r="5" fill="#142D5E" opacity="0.6" />
    <polygon points="250,434 256,444 250,454 244,444" />
    <circle cx="295" cy="442" r="5" fill="#142D5E" opacity="0.6" />
  </g>

  <!-- Subtle Inner Coordinate Ring -->
  <circle cx="250" cy="250" r="148" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Master S-Human-Arrow Glyph (Bold & Dominant) -->
  <g transform="translate(250, 252) scale(1.5)">
    <!-- Human Head (Node SDM) -->
    <circle cx="-20" cy="-60" r="18" fill="#0B1F4D" />
    
    <!-- Upper S curve (Torso / Pelindung) -->
    <path d="M -56,-14 C -56,-42 -36,-50 -8,-50 C 22,-50 42,-32 42,-8 C 42,16 20,28 -8,34" 
          stroke="#0B1F4D" stroke-width="16" stroke-linecap="round" fill="none" />
    
    <!-- Lower S curve (Fondasi Usaha) -->
    <path d="M -40,30 C -50,48 -30,66 -4,66 C 24,66 48,48 58,24" 
          stroke="#142D5E" stroke-width="16" stroke-linecap="round" fill="none" />
    
    <!-- Arrow Shaft (Poros Akselerasi) -->
    <path d="M -18,40 L 46,-32" 
          stroke="#0B1F4D" stroke-width="16" stroke-linecap="round" fill="none" />
    
    <!-- Geometric Arrow Head (Mata Panah Tajam) -->
    <polygon points="26,-54 72,-56 70,-10 54,-26 40,-12 30,-22 46,-36" fill="#0B1F4D" />
  </g>
</svg>